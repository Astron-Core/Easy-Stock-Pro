    #login-screen {
      background: #02040a !important;
      position: relative;
      overflow: hidden;
    }
    #energy-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
      cursor: pointer;
    }
    .core-hint, .core-label {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      pointer-events: none;
      letter-spacing: 3px;
      text-transform: uppercase;
      transition: opacity 0.4s ease;

      color: rgba(0, 220, 255, 0.4);

    .core-label {

  <script>
  /* =========================================================
     1) ENERGY CORE animation + login toggle
     2) Navigation that actually shows page content
     ========================================================= */
  (function() {
    // ---------- Energy Core ----------
    var canvas = document.getElementById('energy-canvas');
    if (canvas) {
      var ctx = canvas.getContext('2d');
      var W, H, CX, CY, baseScale, time = 0;
      var formOpen = false;
      var loginScreen = document.getElementById('login-screen');

      function resize() {
        W = canvas.width = window.innerWidth;
        H = canvas.height = window.innerHeight;
        CX = W / 2; CY = H / 2;
        baseScale = Math.min(W, H) * 0.22;
      }
      window.addEventListener('resize', resize);
      resize();

      function project(x, y, z) {
        var fov = 380, pz = z + fov;
        if (pz < 8) pz = 8;
        var f = fov / pz;
        return { x: CX + x * f, y: CY + y * f, s: Math.max(0.08, f) };
      }

      function drawCore(scale, breath) {
        var r = scale * (0.85 + breath * 0.06);
        for (var i = 5; i >= 0; i--) {
          var gr = r * (1.8 + i * 0.35);
          var g = ctx.createRadialGradient(CX, CY, r * 0.3, CX, CY, gr);
          g.addColorStop(0, 'rgba(0,180,255,' + (0.04 + (5 - i) * 0.015) + ')');
          g.addColorStop(0.5, 'rgba(0,100,220,' + (0.02 + (5 - i) * 0.008) + ')');
          g.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.beginPath(); ctx.arc(CX, CY, gr, 0, Math.PI * 2);
          ctx.fillStyle = g; ctx.fill();
        }
        var body = ctx.createRadialGradient(CX - r * 0.2, CY - r * 0.25, r * 0.05, CX, CY, r);
        body.addColorStop(0, 'rgba(200,255,255,0.98)');
        body.addColorStop(0.2, 'rgba(0,230,255,0.9)');
        body.addColorStop(0.45, 'rgba(0,140,255,0.65)');
        body.addColorStop(0.75, 'rgba(0,60,180,0.3)');
        body.addColorStop(1, 'rgba(0,20,60,0.05)');
        ctx.beginPath(); ctx.arc(CX, CY, r, 0, Math.PI * 2);
        ctx.fillStyle = body; ctx.fill();

        var core = ctx.createRadialGradient(CX, CY, 0, CX, CY, r * 0.4);
        core.addColorStop(0, 'rgba(255,255,255,0.95)');
        core.addColorStop(0.35, 'rgba(150,255,255,0.7)');
        core.addColorStop(1, 'rgba(0,180,255,0)');
        ctx.beginPath(); ctx.arc(CX, CY, r * 0.4, 0, Math.PI * 2);
        ctx.fillStyle = core; ctx.fill();

        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        var band = ctx.createLinearGradient(CX - r * 1.4, CY, CX + r * 1.4, CY);
        band.addColorStop(0, 'rgba(0,180,255,0)');
        band.addColorStop(0.3, 'rgba(80,220,255,0.25)');
        band.addColorStop(0.5, 'rgba(180,255,255,0.45)');
        band.addColorStop(0.7, 'rgba(80,220,255,0.25)');
        band.addColorStop(1, 'rgba(0,180,255,0)');
        ctx.fillStyle = band;
        ctx.fillRect(CX - r * 1.4, CY - r * 0.07, r * 2.8, r * 0.14);
        ctx.restore();
      }

      function GyroRing(radius, axis, speed, thickness, hue, nodes) {
        this.radius = radius; this.axis = axis; this.speed = speed;
        this.thickness = thickness; this.hue = hue; this.nodes = nodes || 16;
        this.angle = Math.random() * Math.PI * 2;
        this.lightPos = Math.random();
        this.lightSpeed = 0.28 + Math.random() * 0.4;
      }
      GyroRing.prototype.update = function(dt) {
        this.angle += this.speed * dt;
        this.lightPos = (this.lightPos + this.lightSpeed * dt) % 1;
      };
      GyroRing.prototype.draw = function(scale, breath) {
        var r = this.radius * scale * (1 + breath * 0.02);
        var pts = [], segs = 64, i, a, x, y, z, c, s, tilt, ty, tz;
        for (i = 0; i <= segs; i++) {
          a = (i / segs) * Math.PI * 2;
          if (this.axis === 'y') {
            x = Math.cos(a) * r; y = 0; z = Math.sin(a) * r;
            c = Math.cos(this.angle); s = Math.sin(this.angle);
            var nx = x * c - z * s; z = x * s + z * c; x = nx;
          } else if (this.axis === 'x') {
            x = 0; y = Math.cos(a) * r; z = Math.sin(a) * r;
            c = Math.cos(this.angle); s = Math.sin(this.angle);
            var ny = y * c - z * s; z = y * s + z * c; y = ny;
          } else {
            x = Math.cos(a + this.angle) * r;
            y = Math.sin(a + this.angle) * r; z = 0;
          }
          tilt = Math.sin(time * 0.25 + this.radius) * 0.09;
          ty = y * Math.cos(tilt) - z * Math.sin(tilt);
          tz = y * Math.sin(tilt) + z * Math.cos(tilt);
          pts.push(project(x, ty, tz));
        }
        ctx.beginPath();
        pts.forEach(function(p, idx) { idx === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y); });
        ctx.closePath();
        ctx.strokeStyle = 'hsla(' + this.hue + ',90%,65%,0.22)';
        ctx.lineWidth = this.thickness * 0.7;
        ctx.lineCap = 'round';
        ctx.stroke();

        for (var n = 0; n < this.nodes; n++) {
          var idx = Math.floor((n / this.nodes) * segs);
          var p = pts[idx];
          var pulse = 0.7 + Math.sin(time * 2.5 + n * 0.8) * 0.3;
          var size = Math.max(0.8, 1.6 * pulse * p.s);
          ctx.beginPath(); ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
          ctx.fillStyle = 'hsla(' + (this.hue + 15) + ',100%,75%,0.85)';
          ctx.shadowColor = 'hsla(' + this.hue + ',100%,70%,0.7)';
          ctx.shadowBlur = 8; ctx.fill();
        }
        ctx.shadowBlur = 0;
        var lightIdx = Math.floor(this.lightPos * segs);
        for (var t = 0; t < 12; t++) {
          var li = (lightIdx - t + segs) % segs;
          var lp = pts[li];
          var intensity = 1 - t / 12;
          var sz = Math.max(0.6, (1.2 + intensity * 2.8) * lp.s);
          ctx.beginPath(); ctx.arc(lp.x, lp.y, sz, 0, Math.PI * 2);
          ctx.fillStyle = 'hsla(' + (this.hue + intensity * 30) + ',100%,' + (55 + intensity * 30) + '%,' + (0.15 + intensity * 0.8) + ')';
          ctx.shadowColor = 'hsla(' + this.hue + ',100%,70%,' + (intensity * 0.85) + ')';
          ctx.shadowBlur = 6 + intensity * 12; ctx.fill();
        }
        ctx.shadowBlur = 0;
      };

      var rings = [
        new GyroRing(1.15, 'y', 0.48, 2.2, 175, 20),
        new GyroRing(1.55, 'y', -0.32, 1.8, 195, 16),
        new GyroRing(1.15, 'x', 0.38, 2.1, 210, 18),
        new GyroRing(1.55, 'x', -0.42, 1.7, 165, 14),
        new GyroRing(1.15, 'z', 0.55, 2.0, 185, 16),
        new GyroRing(1.65, 'z', -0.28, 1.6, 220, 12)
      ];

      function Particle() { this.reset(true); }
      Particle.prototype.reset = function(init) {
        this.theta = Math.random() * Math.PI * 2;
        this.phi = Math.acos(2 * Math.random() - 1);
        this.r = 1.7 + Math.random() * 1.6;
        this.speed = 0.15 + Math.random() * 0.45;
        this.size = 0.9 + Math.random() * 2.0;
        this.life = init ? Math.random() * 6 : 0;
        this.maxLife = 5 + Math.random() * 7;
        this.hue = 155 + Math.random() * 80;
      };
      Particle.prototype.update = function(dt) {
        this.theta += this.speed * dt * 0.35;
        this.life += dt;
        if (this.life > this.maxLife) this.reset();
      };
      Particle.prototype.draw = function(scale) {
        var alpha = this.life < 0.6 ? this.life / 0.6 :
                    this.life > this.maxLife - 0.9 ? (this.maxLife - this.life) / 0.9 : 1;
        var x = Math.sin(this.phi) * Math.cos(this.theta) * this.r * scale;
        var y = Math.cos(this.phi) * this.r * scale * 0.55;
        var z = Math.sin(this.phi) * Math.sin(this.theta) * this.r * scale;
        var p = project(x, y, z);
        var r = Math.max(0.5, this.size * p.s);
        ctx.globalAlpha = alpha * 0.65;
        ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
        ctx.fillStyle = 'hsla(' + this.hue + ',100%,75%,1)';
        ctx.shadowColor = 'hsla(' + this.hue + ',100%,70%,0.7)';
        ctx.shadowBlur = 8; ctx.fill();
        ctx.globalAlpha = 1; ctx.shadowBlur = 0;
      };
      var particles = [];
      for (var pi = 0; pi < 40; pi++) particles.push(new Particle());

      function toggleForm() {
        formOpen = !formOpen;
        if (formOpen) {
          loginScreen.classList.add('form-open');
          setTimeout(function() {
            var u = document.getElementById('login-usr');
            if (u) u.focus();
          }, 300);
        } else {
          loginScreen.classList.remove('form-open');
        }
      }

      canvas.addEventListener('click', toggleForm);
      var closeBtn = document.getElementById('login-close-btn');
      if (closeBtn) {
        closeBtn.addEventListener('click', function(e) {
          e.stopPropagation();
          if (formOpen) toggleForm();
        });
      }
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && formOpen) toggleForm();
      });

      var last = performance.now();
      function frame(now) {
        if (loginScreen.style.display === 'none') return;
        var dt = Math.min((now - last) / 1000, 0.05);
        last = now; time += dt;
        var breath = Math.sin(time * 0.9) * 0.5 + 0.5;
        var scale = baseScale;
        ctx.clearRect(0, 0, W, H);
        var bg = ctx.createRadialGradient(CX, CY, 0, CX, CY, Math.max(W, H) * 0.7);
        bg.addColorStop(0, 'rgba(0,20,45,0.2)');
        bg.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
        particles.forEach(function(p) { p.update(dt); p.draw(scale); });
        rings.forEach(function(r) { r.update(dt); r.draw(scale, breath); });
        drawCore(scale, breath);
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    }

    // ---------- Navigation (reliable) ----------
    var PAGE_TITLES = {
      dashboard: 'Home',
      stock: 'Stock',
      refrigerator: 'Refrigerator',
      profile: 'Profile'
    };

    function setActiveNav(page, stockSub) {
      document.querySelectorAll('.side-nav-item').forEach(function(el) {
        el.classList.remove('active');
      });
      var subnav = document.getElementById('stock-subnav');
      if (page === 'stock') {
        if (subnav) subnav.classList.add('open');
        var sb = document.getElementById('nav-stock');
        if (sb) sb.classList.add('active');
        if (stockSub) {
          var sub = document.getElementById('nav-stock-' + stockSub);
          if (sub) sub.classList.add('active');
        }
      } else {
        if (subnav) subnav.classList.remove('open');
        var btn = document.getElementById('nav-' + page);
        if (btn) btn.classList.add('active');
      }
      var title = document.getElementById('topbar-title');
      if (title) title.textContent = PAGE_TITLES[page] || page;
    }

    function showPage(page) {
      ['dashboard', 'stock', 'refrigerator', 'profile'].forEach(function(p) {
        var el = document.getElementById('page-' + p);
        if (el) el.style.display = 'none';
      });
      var target = document.getElementById('page-' + page);
      if (target) {
        target.style.display = 'block';
      }
    }

    // Mobile sidebar drawer
    window.toggleSidebar = function() {
      var sb = document.getElementById('app-sidebar');
      if (!sb) return;
      if (sb.classList.contains('open')) closeSidebar();
      else openSidebar();
    };
    window.openSidebar = function() {
      var sb = document.getElementById('app-sidebar');
      var ov = document.getElementById('sidebar-overlay');
      if (sb) sb.classList.add('open');
      if (ov) ov.classList.add('show');
    };
    window.closeSidebar = function() {
      var sb = document.getElementById('app-sidebar');
      var ov = document.getElementById('sidebar-overlay');
      if (sb) sb.classList.remove('open');
      if (ov) ov.classList.remove('show');
    };

    // Public helpers used by sidebar buttons
    window.goPage = function(page) {
      showPage(page);
      setActiveNav(page);
      // Keep drawer open on Stock so user can pick a sub-menu; close for other pages
      if (page !== 'stock') closeSidebar();
      if (page === 'dashboard' && typeof window.loadDashboard === 'function') {
        setTimeout(function() { window.loadDashboard(); }, 50);
      }
      // also call original switchPage if exists (for any side effects)
      // but avoid bottom-nav errors
      try {
        var mainNav = document.getElementById('main-bottom-nav');
        var stockNav = document.getElementById('stock-bottom-nav');
        if (mainNav) mainNav.style.display = 'none';
        if (stockNav) stockNav.style.display = 'none';
      } catch (e) {}
    };

    window.goStockSub = function(subpage) {
      showPage('stock');
      setActiveNav('stock', subpage);
      closeSidebar();

      var STOCK_SUBS = ['report', 'inbound', 'outbound', 'materials'];

      // Prefer original switchStockSubpage, then force-correct Materials visibility
      if (typeof window.switchStockSubpage === 'function') {
        try { window.switchStockSubpage(subpage); } catch (e) {}
      }

      STOCK_SUBS.forEach(function(p) {
        var el = document.getElementById('stock-sub-' + p);
        if (el) el.style.display = (p === subpage) ? 'block' : 'none';
        var nav = document.getElementById('nav-stock-' + p);
        if (nav) {
          if (p === subpage) nav.classList.add('active');
          else nav.classList.remove('active');
        }
      });

      // Load material master for inbound / materials
      if (typeof currentUser !== 'undefined' && currentUser && typeof google !== 'undefined') {
        try {
          google.script.run
            .withSuccessHandler(function(data) {
              if (typeof masterDataList !== 'undefined') masterDataList = data;
              if (subpage === 'materials' && typeof window.matRenderList === 'function') {
                window.matRenderList(data || []);
              }
            })
            .withFailureHandler(function() {
              if (subpage === 'materials' && typeof window.matRenderList === 'function') {
                window.matRenderList([]);
              }
            })
            .getMaterialMaster(currentUser.site);
        } catch (e) {}
      }

      if (subpage === 'materials' && typeof window.matOnShow === 'function') {
        try { window.matOnShow(); } catch (e) {}
      }
    };

    // Override switchPage / enterStockMode / exitStockMode used by old code
    window.switchPage = function(page) { window.goPage(page); };
    window.enterStockMode = function() { window.goStockSub('report'); };
    window.exitStockMode = function() { window.goPage('dashboard'); };

    // ----- Notifications -----
    var _notifItems = [];
    var _notifOpen = false;

    window.toggleNotifPanel = function (ev) {
      if (ev) ev.stopPropagation();
      var panel = document.getElementById('notif-panel');
      if (!panel) return;
      if (_notifOpen) {
        closeNotifPanel();
      } else {
        panel.classList.add('open');
        _notifOpen = true;
        loadNotifications(true);
      }
    };

    window.closeNotifPanel = function () {
      var panel = document.getElementById('notif-panel');
      if (panel) panel.classList.remove('open');
      _notifOpen = false;
    };

    function notifSetBadge(n) {
      var badge = document.getElementById('notif-badge');
      if (!badge) return;
      if (n > 0) {
        badge.textContent = n > 99 ? '99+' : String(n);
        badge.classList.add('show');
      } else {
        badge.classList.remove('show');
        badge.textContent = '0';
      }
    }

    function notifIconClass(type, severity) {
      if (type === 'low_stock') return 'fa-box';
      if (type === 'expired') return 'fa-calendar-xmark';
      if (type === 'expiring') return 'fa-clock';
      return 'fa-circle-info';
    }

    function notifRenderList(items) {
      var el = document.getElementById('notif-list');
      if (!el) return;
      if (!items || !items.length) {
        el.innerHTML = '<div class="notif-empty"><i class="fa-solid fa-check-circle" style="color:var(--success);font-size:22px;display:block;margin-bottom:8px;"></i>All clear — no alerts</div>';
        return;
      }
      var html = '';
      for (var i = 0; i < items.length; i++) {
        var it = items[i];
        var sev = it.severity || 'info';
        html +=
          '<div class="notif-item" onclick="notifClickItem(\'' + String(it.action || '').replace(/'/g, '') + '\')">' +
            '<div class="notif-icon ' + sev + '"><i class="fa-solid ' + notifIconClass(it.type, sev) + '"></i></div>' +
            '<div class="notif-text">' +
              '<p class="notif-title">' + String(it.title || '').replace(/</g, '&lt;') + '</p>' +
              '<p class="notif-msg">' + String(it.message || '').replace(/</g, '&lt;') + '</p>' +
            '</div>' +
          '</div>';
      }
      el.innerHTML = html;
    }

    window.loadNotifications = function (showLoading) {
      if (typeof currentUser === 'undefined' || !currentUser) return;
      var list = document.getElementById('notif-list');
      if (showLoading && list && _notifOpen) {
        list.innerHTML = '<div class="notif-empty"><i class="fa-solid fa-spinner fa-spin"></i> Checking stock alerts...</div>';
      }
      try {
        google.script.run
          .withSuccessHandler(function (res) {
            _notifItems = (res && res.items) ? res.items : [];
            notifSetBadge(res && res.count ? res.count : _notifItems.length);
            if (_notifOpen) notifRenderList(_notifItems);
          })
          .withFailureHandler(function () {
            if (_notifOpen && list) {
              list.innerHTML = '<div class="notif-empty">Could not load notifications</div>';
            }
          })
          .getAppNotifications(currentUser.site);
      } catch (e) {}
    };

    window.notifClickItem = function (action) {
      closeNotifPanel();
      if (typeof window.goStockSub === 'function') {
        window.goStockSub('report');
      }
      setTimeout(function () {
        if (typeof window.openReportView === 'function') {
          if (action === 'expired') window.openReportView('expired');
          else window.openReportView('balance');
        }
      }, 120);
    };

    window.notifOpenReports = function () {
      closeNotifPanel();
      if (typeof window.goStockSub === 'function') window.goStockSub('report');
    };

    // ----- Topbar avatar (image or initial) -----
    window.updateTopbarAvatar = function() {
      var box = document.getElementById('topbar-avatar');
      if (!box || typeof currentUser === 'undefined' || !currentUser) return;
      var name = (currentUser.givenName || currentUser.username || 'U').trim();
      var initial = name.charAt(0).toUpperCase();
      var imgUrl = currentUser.image || '';
      if (imgUrl && String(imgUrl).trim() !== '') {
        box.innerHTML = '<img src="' + imgUrl.replace(/"/g, '') + '" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:50%;display:block;">';
      } else {
        box.innerHTML = '<span id="topbar-avatar-initial">' + initial + '</span>';
      }
    };

    // Show/hide profile action buttons on topbar
    function setTopbarProfileActions(show) {
      var editBtn = document.getElementById('topbar-btn-edit');
      var addBtn = document.getElementById('topbar-btn-adduser');
      if (editBtn) editBtn.style.display = show ? 'flex' : 'none';
      if (addBtn) addBtn.style.display = (show && window._isAdminUser) ? 'flex' : 'none';
    }

    // Patch goPage to toggle topbar profile buttons
    var _goPageOrig = window.goPage;
    window.goPage = function(page) {
      _goPageOrig(page);
      setTopbarProfileActions(page === 'profile');
    };

    window.topbarEditProfile = function() {
      if (typeof window.goPage === 'function') window.goPage('profile');
      setTimeout(function() {
        var sec = document.getElementById('edit-profile-section');
        if (!sec) return;
        var open = sec.style.display === 'block';
        sec.style.display = open ? 'none' : 'block';
        if (typeof updateEditBtnState === 'function') updateEditBtnState();
        // highlight topbar btn
        var btn = document.getElementById('topbar-btn-edit');
        if (btn) btn.classList.toggle('active-action', sec.style.display === 'block');
      }, 80);
    };

    window.topbarAddUser = function() {
      if (typeof window.goPage === 'function') window.goPage('profile');
      setTimeout(function() {
        var sec = document.getElementById('create-user-section');
        if (!sec) return;
        // ensure manage section visible
        var ms = document.getElementById('manage-section');
        if (ms) ms.style.display = 'block';
        var open = sec.style.display === 'block';
        sec.style.display = open ? 'none' : 'block';
        if (typeof updateCreateBtnState === 'function') updateCreateBtnState();
        var btn = document.getElementById('topbar-btn-adduser');
        if (btn) btn.classList.toggle('active-action', sec.style.display === 'block');
      }, 80);
    };

    // Patch setupAppUI: MUST use display:flex not block
    function patchSetup() {
      if (typeof window.setupAppUI !== 'function' || window.setupAppUI._patched) return false;
      var orig = window.setupAppUI;
      window.setupAppUI = function() {
        document.getElementById('login-screen').style.display = 'none';
        var app = document.getElementById('app-screen');
        app.style.display = 'flex'; // critical for sidebar layout

        if (typeof updateProfileHeaderDisplay === 'function') updateProfileHeaderDisplay();
        try {
          document.getElementById('prof-name').innerText = currentUser.givenName + ' ' + currentUser.familyName;
          document.getElementById('prof-role').innerText = 'Role: ' + currentUser.role.toUpperCase();
          document.getElementById('prof-site').innerText = 'Site: ' + currentUser.site;
        } catch (e) {}

        if (currentUser.role === 'superadmin' || currentUser.role === 'admin') {
          var ms = document.getElementById('manage-section');
          if (ms) ms.style.display = 'block';
          if (typeof setupManagementForm === 'function') setupManagementForm();
          if (typeof loadManagedUsers === 'function') loadManagedUsers();
        } else {
          var ms2 = document.getElementById('manage-section');
          if (ms2) ms2.style.display = 'none';
        }

        var fullName = ((currentUser.givenName || '') + ' ' + (currentUser.familyName || '')).trim() || currentUser.username || 'User';
        var nameEl = document.getElementById('topbar-username');
        if (nameEl) nameEl.textContent = fullName;

        var sideName = document.getElementById('sidebar-username');
        var sideMeta = document.getElementById('sidebar-usermeta');
        if (sideName) sideName.textContent = fullName;
        if (sideMeta) {
          sideMeta.innerHTML =
            'Role: ' + (currentUser.role || '—').toUpperCase() + '<br>' +
            'Site: ' + (currentUser.site || '—');
        }

        // Topbar avatar: real image or first letter
        updateTopbarAvatar();

        // Show Add User topbar btn only for admin roles
        window._isAdminUser = (currentUser.role === 'superadmin' || currentUser.role === 'admin');

        window.goPage('dashboard');

        // Load notification badge after login
        setTimeout(function () { loadNotifications(false); }, 400);
        if (!window._notifTimer) {
          window._notifTimer = setInterval(function () { loadNotifications(false); }, 5 * 60 * 1000);
        }
      };
      window.setupAppUI._patched = true;
      return true;
    }

    var tries = 0;
    var t = setInterval(function() {
      tries++;
      if (patchSetup() || tries > 50) clearInterval(t);
    }, 100);
  })();
  </script>
</body>
</html>
